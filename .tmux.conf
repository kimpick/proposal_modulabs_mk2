# .tmux.conf — 모두의연구소 AI 교육 제안서 프로젝트
# Usage: tmux attach (자동 로딩) 또는 scripts/dev.sh {기업명}

# ── 기본 설정 ────────────────────────────────────────────────────
# 256컬러 + 이탤릭 지원
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# 시작 인덱스 1 (panes/windows)
set -g base-index 1
setw -g pane-base-index 1

# 마우스 지원 (스크롤, 리사이즈, pane 선택)
set -g mouse on

# ESC 키 지연 제거 (vim 사용자 필수)
set -sg escape-time 0

# 히스토리 한계 증가
set -g history-limit 50000

# 윈도우/페인 종료 시 인덱스 재정렬
set -g renumber-windows on

# ── 단축키 (Prefix: Ctrl+b) ──────────────────────────────────────
# Prefix 유지하되, 자주 쓰는 명령은 직접 바인딩
# r: config 리로드
bind r source-file ~/.tmux.conf \; display "✅ tmux.conf reloaded"

# 직관적 pane 분할 (|: 좌우, -: 위아래)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# vim 스타일 pane 이동
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+방향키로 pane 리사이즈 (prefix 불필요)
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5

# Shift+방향키로 윈도우 이동 (prefix 불필요)
bind -n S-Left previous-window
bind -n S-Right next-window

# ── 프로젝트 단축키 (Prefix + 대문자) ─────────────────────────────
# P: 현재 기업 PDF 빌드
bind B run-shell "cd #{pane_current_path} && python build.py $(basename #{pane_current_path}) 2>&1 | tail -5" \; display "✅ build executed"

# V: content.json 검증
bind V run-shell "cd #{pane_current_path} && python scripts/validate_content.py . 2>&1 | tail -10"

# G: git status
bind G run-shell "cd #{pane_current_path} && git status -sb"

# ── 디자인 (테마) ────────────────────────────────────────────────
# 모두의연구소 브랜드 컬러 (#EE3E4C 포인트) 적용
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-interval 5

# 상태바 좌측: 세션명 (빨강)
set -g status-left "#[fg=white,bg=#EE3E4C,bold] #S #[fg=#EE3E4C,bg=default]▌"
set -g status-left-length 40

# 상태바 우측: 시간 + 호스트
set -g status-right "#[fg=#EBBAC0]🟢 #{pane_current_path} #[fg=white]| %H:%M "
set -g status-right-length 80

# 윈도우 상태 표시
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[fg=white,bg=#EE3E4C,bold] #I:#W #[default]"
setw -g window-status-separator      ""

# 패인 보더 (활성 pane 강조)
set -g pane-border-style fg=#EBEBEB
set -g pane-active-border-style fg=#EE3E4C,bold

# 복사 모드 vim 스타일
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
